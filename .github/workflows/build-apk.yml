name: WolfEdu CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ustal numer wersji
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n1)"
          test -n "$BASE_VERSION" || { echo "Brakuje VERSION_NAME w version.properties"; exit 1; }

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$BASE_VERSION"
          fi

          VERSION_CODE=$(date -u +%s)

          echo "WOLFEDU_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "WOLFEDU_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Sprawdź sekrety podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Brakuje KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Brakuje KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Brakuje KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Brakuje KEY_PASSWORD"; exit 1; }

      - name: Odtwórz keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build podpisanego APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Przygotuj APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/WolfEdu-${WOLFEDU_VERSION_NAME}.apk"

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: WolfEdu-${{ steps.version.outputs.VERSION_NAME }}-build.${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
