name: WolfEdu CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.VERSION_NAME }}
      version_code: ${{ steps.version.outputs.VERSION_CODE }}

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ustal numer wersji
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            BASE_VERSION="0.9.0"
            SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
            VERSION_NAME="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}+${SAFE_BRANCH}"
          fi

          # Jeden rosnący numer dla wszystkich buildów CI.
          VERSION_CODE=$((900000 + GITHUB_RUN_NUMBER))

          echo "WOLFEDU_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "WOLFEDU_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "WolfEdu $VERSION_NAME ($VERSION_CODE)"
        id: version

      - name: Sprawdź sekrety podpisu
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Brakuje KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Brakuje KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Brakuje KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Brakuje KEY_PASSWORD"; exit 1; }

      - name: Odtwórz keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Odtwórz google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Brakuje GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s app/google-services.json

      - name: Build release
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Build debug dla Pull Request
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon :app:assembleDebug

      - name: Nazwij APK
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/WolfEdu-${WOLFEDU_VERSION_NAME}.apk"

      - name: Artefakt APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: WolfEdu-${{ steps.version.outputs.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pobierz APK z buildu
        uses: actions/download-artifact@v4
        with:
          name: WolfEdu-${{ needs.build.outputs.version_name }}
          path: dist

      - name: Utwórz Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=$(find dist -type f -name '*.apk' | head -n1)
          test -n "$APK"

          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"

          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "WolfEdu $VERSION" \
            --generate-notes \
            $PRERELEASE
