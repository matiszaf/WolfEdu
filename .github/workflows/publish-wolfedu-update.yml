name: WolfEdu Update Package

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Wersja, np. 0.10.0"
        required: true
        default: "0.10.0"
      changelog:
        description: "Krótki opis zmian"
        required: true
        default: "Nowa wersja WolfEdu"
      mandatory:
        description: "Aktualizacja wymagana?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package-update:
    name: Build podpisanej paczki aktualizacji
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Sprawdź sekrety
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Brakuje KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Brakuje KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Brakuje KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Brakuje KEY_PASSWORD"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Brakuje GOOGLE_SERVICES_JSON_BASE64"; exit 1; }

      - name: Odtwórz keystore i Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test -s "$RUNNER_TEMP/release.keystore"
          test -s app/google-services.json

      - name: Ustal wersję
        shell: bash
        run: |
          VERSION_NAME='${{ inputs.version_name }}'
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          echo "WOLFEDU_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "WOLFEDU_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Zbuduj paczkę OTA
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          CHANGELOG: ${{ inputs.changelog }}
          MANDATORY: ${{ inputs.mandatory }}
        run: |
          mkdir -p dist/updates/android
          cp app/build/outputs/apk/release/app-release.apk dist/updates/android/WolfEdu.apk
          python3 - <<'PYJSON'
          import json, os, datetime
          payload = {
            "versionName": os.environ["VERSION_NAME"],
            "versionCode": int(os.environ["VERSION_CODE"]),
            "mandatory": os.environ.get("MANDATORY", "false").lower() == "true",
            "apkUrl": "https://wolf-edu.web.app/updates/android/WolfEdu.apk",
            "changelog": os.environ.get("CHANGELOG", ""),
            "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          with open("dist/updates/android/version.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, ensure_ascii=False, indent=2)
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PYJSON

      - name: Artefakt do publikacji
        uses: actions/upload-artifact@v4
        with:
          name: WolfEdu-Update-${{ inputs.version_name }}
          path: dist/updates/android/*
          if-no-files-found: error
          retention-days: 30
