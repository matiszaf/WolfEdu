name: WolfEdu Console CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - "console/**"
      - ".github/workflows/build-console.yml"
    tags:
      - "console-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build WolfEdu Console
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ustal wersję Console
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/console-v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#console-v}"
          else
            VERSION_NAME="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))

          echo "WOLFEDU_CONSOLE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "WOLFEDU_CONSOLE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Sprawdź sekrety Console
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CONSOLE_CONFIG: ${{ secrets.CONSOLE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Brakuje KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Brakuje KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Brakuje KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Brakuje KEY_PASSWORD"; exit 1; }
          test -n "$CONSOLE_CONFIG" || { echo "Brakuje CONSOLE_GOOGLE_SERVICES_JSON_BASE64"; exit 1; }

      - name: Odtwórz keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Odtwórz google-services.json Console
        env:
          CONSOLE_CONFIG: ${{ secrets.CONSOLE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$CONSOLE_CONFIG" | base64 --decode > console/app/google-services.json
          test -s console/app/google-services.json
          grep -q 'pl.wolfedu.console' console/app/google-services.json || { echo "Firebase config nie jest dla pl.wolfedu.console"; exit 1; }

      - name: Zbuduj podpisane WolfEdu Console APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon -p console :app:assembleRelease

      - name: Przygotuj artefakt
        run: |
          mkdir -p dist-console
          cp console/app/build/outputs/apk/release/app-release.apk \
            "dist-console/WolfEdu-Console-${WOLFEDU_CONSOLE_VERSION_NAME}.apk"

      - name: Udostępnij WolfEdu Console APK
        uses: actions/upload-artifact@v4
        with:
          name: WolfEdu-Console-${{ steps.version.outputs.VERSION_NAME }}
          path: dist-console/*.apk
          if-no-files-found: error
          retention-days: 30
