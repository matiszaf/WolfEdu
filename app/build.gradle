plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'pl.wolfedu.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.wolfedu.app'
        minSdk 24
        targetSdk 35

        def versionProps = new Properties()
        def versionFile = rootProject.file('version.properties')
        if (versionFile.exists()) {
            versionFile.withInputStream { versionProps.load(it) }
        }

        def wolfVersionName =
                System.getenv('WOLFEDU_VERSION_NAME') ?:
                project.findProperty('WOLFEDU_VERSION_NAME') ?:
                versionProps.getProperty('VERSION_NAME', '0.10.5')

        def wolfVersionCode =
                (System.getenv('WOLFEDU_VERSION_CODE') ?:
                project.findProperty('WOLFEDU_VERSION_CODE') ?:
                versionProps.getProperty('VERSION_CODE', '12059999')) as Integer

        versionCode wolfVersionCode
        versionName wolfVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_FILE')
            def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('KEY_ALIAS')
            def keyPasswordValue = System.getenv('KEY_PASSWORD')

            if (keystorePath &&
                keystorePassword &&
                keyAliasValue &&
                keyPasswordValue) {

                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
