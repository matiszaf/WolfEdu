plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'pl.wolfedu.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.wolfedu.app'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '4.0.2'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_FILE')
            def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('KEY_ALIAS')
            def keyPasswordValue = System.getenv('KEY_PASSWORD')

            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
