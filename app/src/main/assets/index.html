<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WolfEdu</title>
<style>
:root{--p:#1677ff;--p2:#00b8d9;--navy:#071b33;--bg:#f2f6fb;--card:#fff;--text:#112238;--muted:#6b7a8d;--danger:#d83a52;--ok:#16865c;--line:#dce6f2;--soft:#e7f2ff;--shadow:#071b3314}html[data-theme='dark']{--bg:#08121f;--card:#101f31;--text:#f3f7fc;--muted:#9fb0c4;--line:#21364d;--soft:#132c48;--shadow:#00000055}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),#0b3f73 62%,var(--p2));color:white;padding:20px 18px 24px;position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #4b3cff33;border-radius:0 0 28px 28px}header h1{margin:0;font-size:23px;display:flex;align-items:center;gap:9px}header h1:before{content:"W";width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;font-size:17px;font-weight:950;box-shadow:0 6px 18px #001d3d55}header p{margin:4px 0 0;opacity:.86;font-size:13px}
main{padding:14px 14px 92px;max-width:720px;margin:auto}.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px var(--shadow);border:1px solid #fff}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font-size:18px;margin:2px 0 12px}h3{font-size:15px;margin:0 0 7px}small,.muted{color:var(--muted)}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;outline:none;margin:5px 0}input:focus,select:focus,textarea:focus{border-color:var(--p)}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--p);color:white}button.secondary{background:#eceafd;color:var(--p)}button.danger{background:#ffe8ec;color:var(--danger)}button.mini{padding:7px 10px;font-size:12px}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.badge{padding:4px 8px;border-radius:999px;background:#eceafd;color:var(--p);font-weight:700;font-size:12px}.grade{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#eceafd;color:var(--p);font-weight:800;font-size:17px}.empty{text-align:center;padding:22px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);z-index:9;padding-bottom:max(6px,env(safe-area-inset-bottom))}nav button{background:var(--card);color:var(--muted);border-radius:0;padding:9px 2px 7px;font-size:10px;font-weight:600}nav button.active{color:var(--p)}nav .ico{font-size:19px;display:block;margin-bottom:2px}.hidden{display:none!important}.stat{padding:14px;border-radius:16px;background:var(--soft)}.stat b{display:block;font-size:23px;color:var(--p)}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:white;border:0;padding:18px}.hero small{color:#ffffffcc}.hero h2{font-size:22px;margin:3px 0 8px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{background:var(--card);color:var(--text);border:1px solid var(--line);text-align:left;min-height:86px;padding:14px;box-shadow:0 4px 14px var(--shadow)}.quick .qico{display:block;font-size:24px;margin-bottom:8px}.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.section-title h2{margin:0}.linkbtn{background:transparent;color:var(--p);padding:6px}.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}.version{font-size:12px;text-align:center;color:var(--muted);padding:8px}.day{font-weight:800;margin:13px 0 5px}.lesson{display:flex;gap:10px;align-items:center}.time{font-weight:700;color:var(--p);min-width:48px}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1d2330;color:white;padding:10px 14px;border-radius:12px;z-index:20;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.setup{min-height:75vh;display:grid;place-items:center}.setup .card{width:100%;max-width:460px}.avatar{width:42px;height:42px;border-radius:13px;background:#eceafd;display:grid;place-items:center;font-weight:800;color:var(--p)}.subject-card{padding:13px;border:1px solid var(--line);border-radius:15px;margin:9px 0}.subject-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.subject-avg{font-size:20px;font-weight:900;color:var(--p)}.grade-chip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--p);padding:7px 9px;border-radius:11px;margin:4px 4px 0 0;font-weight:800}.grade-chip small{color:var(--muted);font-weight:600}.actions{display:flex;gap:6px;margin-left:auto}.calc-result{padding:15px;border-radius:15px;background:var(--soft);margin-top:10px;text-align:center}.calc-result b{font-size:25px;color:var(--p);display:block}.filterbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.warn{background:#fff4df;color:#8a5900;padding:10px;border-radius:12px;font-size:13px}.task-overdue{border-left:4px solid var(--danger);padding-left:10px}.task-done{opacity:.62}.task-done b{text-decoration:line-through}.task-type{font-size:11px;padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--p);font-weight:800}.task-date{font-weight:800;color:var(--p)}.task-date.overdue{color:var(--danger)}
.splash{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 70% 15%,#1677ff55,transparent 38%),linear-gradient(145deg,#06182d,#0a3765);display:grid;place-items:center;color:white;transition:opacity .45s,visibility .45s}.splash.hide{opacity:0;visibility:hidden}.splash-logo{width:94px;height:94px;border-radius:28px;background:linear-gradient(135deg,#1677ff,#00b8d9);display:grid;place-items:center;font-size:47px;font-weight:950;box-shadow:0 22px 60px #0008}.splash h1{font-size:34px;margin:18px 0 3px}.splash p{margin:0;color:#cbe8ff}.brand-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#ffffff20;font-size:12px;margin-bottom:8px}.hero{position:relative;overflow:hidden}.hero:after{content:"W";position:absolute;right:-7px;bottom:-34px;font-size:130px;font-weight:950;color:#ffffff12;transform:rotate(-8deg)}

.sync-pill{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:6px 10px;border-radius:999px;background:#ffffff1c;font-size:12px;font-weight:750}.sync-dot{width:8px;height:8px;border-radius:50%;background:#a9b8c8}.sync-pill.online .sync-dot{background:#55e6a5;box-shadow:0 0 0 4px #55e6a522}.sync-pill.syncing .sync-dot{background:#ffd166;animation:pulse 1s infinite}.sync-pill.pending .sync-dot{background:#ff9b71}.sync-box{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--soft)}.sync-box input{background:var(--card)}.sync-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.sync-email{font-weight:800;color:var(--p);word-break:break-all}.sync-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}.sync-state{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}.sync-state .bigdot{width:13px;height:13px;border-radius:50%;margin-top:4px;background:#a9b8c8}.sync-state .bigdot.online{background:var(--ok)}.sync-state .bigdot.syncing{background:#d99b00}.sync-state .bigdot.pending{background:#e66a3d}@keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<div id="splash" class="splash"><div style="text-align:center"><div class="splash-logo">W</div><h1>WolfEdu</h1><p>Szkoła pod kontrolą</p></div></div>
<header><h1 id="headTitle">WolfEdu</h1><p id="headSub">Twój inteligentny dziennik szkolny</p><div id="syncPill" class="sync-pill"><span class="sync-dot"></span><span id="syncPillText">Tylko lokalnie</span></div></header>
<main id="app"></main>
<nav id="nav" class="hidden">
<button data-page="home"><span class="ico">🏠</span>Start</button><button data-page="classes"><span class="ico">👥</span>Klasy</button><button data-page="grades"><span class="ico">⭐</span>Oceny</button><button data-page="tasks"><span class="ico">📝</span>Zadania</button><button data-page="attendance"><span class="ico">✅</span>Frekw.</button><button data-page="plan"><span class="ico">📅</span>Plan</button><button data-page="settings"><span class="ico">⚙️</span>Opcje</button>
</nav><div id="toast" class="toast"></div>
<script>
const KEY='wolfEduDataV1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{school:'',classes:[],students:[],grades:[],attendance:[],lessons:[],tasks:[]};
let page='home',editingGradeId=null; const $=s=>document.querySelector(s); const app=$('#app');
function migrate(){db.grades=(db.grades||[]).map(g=>({...g,weight:Number(g.weight||1)}));db.subjects=db.subjects||[];db.tasks=(db.tasks||[]).map(t=>({...t,done:Boolean(t.done),type:t.type||'Zadanie domowe',priority:t.priority||'Normalny'}));save()}
function save(){db._sync=db._sync||{};db._sync.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db));scheduleCloudSync()}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function setHead(t,s){$('#headTitle').textContent=t;$('#headSub').textContent=s||db.school}
function setup(){setHead('WolfEdu','Pierwsza konfiguracja');$('#nav').classList.add('hidden');app.innerHTML=`<section class="setup"><div class="card"><h2>Utwórz swoją szkołę</h2><p class="muted">Dane zostają wyłącznie na tym telefonie.</p><input id="school" placeholder="Nazwa szkoły, np. SP 35 w Gdyni"><button style="width:100%;margin-top:8px" onclick="createSchool()">Uruchom WolfEdu</button></div></section>`}
function createSchool(){let v=$('#school').value.trim();if(!v)return toast('Wpisz nazwę szkoły');db.school=v;save();render('home')}
function render(p=page){page=p;if(!db.school)return setup();$('#nav').classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({home,classes,grades,tasks,attendance,plan,settings}[page]||home)()}
function home(){setHead(db.school,new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}));let allWeight=db.grades.reduce((a,g)=>a+Number(g.weight||1),0),avg=allWeight?(db.grades.reduce((a,g)=>a+Number(g.value)*Number(g.weight||1),0)/allWeight).toFixed(2):'—';let total=db.attendance.length, present=db.attendance.filter(a=>a.state==='Obecny').length,att=total?Math.round(present/total*100):100;let day=days[(new Date().getDay()+6)%7],next=db.lessons.filter(l=>l.day===day).sort((a,b)=>a.time.localeCompare(b.time))[0];app.innerHTML=`<div class="card hero"><span class="brand-pill">🐺 WolfEdu 3.0</span><small>Dzień dobry 👋</small><h2>${esc(db.school)}</h2><div>${next?`Najbliższa lekcja: <b>${esc(next.subject)}</b> o ${esc(next.time)}`:'Na dziś nie masz wpisanych lekcji.'}</div></div><div class="section-title"><h2>Skróty</h2></div><div class="quick"><button onclick="render('grades')"><span class="qico">⭐</span><b>Oceny</b><br><small>Dodaj i przeglądaj</small></button><button onclick="render('plan')"><span class="qico">📅</span><b>Plan lekcji</b><br><small>Sprawdź zajęcia</small></button><button onclick="render('tasks')"><span class="qico">📝</span><b>Zadania</b><br><small>Terminy i sprawdziany</small></button><button onclick="render('attendance')"><span class="qico">✅</span><b>Frekwencja</b><br><small>Zapisz obecność</small></button><button onclick="render('classes')"><span class="qico">👥</span><b>Klasy</b><br><small>Uczniowie i grupy</small></button></div><div class="section-title"><h2>Podsumowanie</h2></div><div class="grid"><div class="stat"><small>Uczniowie</small><b>${db.students.length}</b></div><div class="stat"><small>Średnia ocen</small><b>${avg}</b></div></div><div class="card" style="margin-top:12px"><div class="row between"><div><h3>Frekwencja</h3><small>${present} obecności z ${total} wpisów</small></div><b>${att}%</b></div><div class="progress"><span style="width:${att}%"></span></div></div><div class="card"><div class="row between"><h2 style="margin:0">Najbliższe terminy</h2><button class="linkbtn" onclick="render('tasks')">Wszystkie</button></div>${db.tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3).map(t=>`<div class="item"><div class="row between"><div><span class="task-type">${esc(t.type)}</span> <b>${esc(t.title)}</b><br><small>${esc(t.subject||'Bez przedmiotu')}</small></div><span class="task-date">${new Date(t.due+'T12:00:00').toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})}</span></div></div>`).join('')||'<div class="empty">Brak nadchodzących terminów</div>'}</div><div class="card"><div class="row between"><h2 style="margin:0">Ostatnie oceny</h2><button class="linkbtn" onclick="render('grades')">Wszystkie</button></div>${db.grades.slice(-4).reverse().map(g=>{let st=db.students.find(x=>x.id===g.studentId);return `<div class="item row"><div class="grade">${esc(g.value)}</div><div><b>${esc(st?.name||'Usunięty uczeń')}</b><br><small>${esc(g.subject)} · ${esc(g.note||'bez opisu')}</small></div></div>`}).join('')||'<div class="empty">Brak ocen</div>'}</div>`}
function classes(){setHead('Klasy i uczniowie',db.school);app.innerHTML=`<div class="card"><h2>Dodaj klasę</h2><div class="row"><input id="className" placeholder="np. 8B"><button onclick="addClass()">Dodaj</button></div></div>${db.classes.map(c=>`<div class="card"><div class="row between"><div><h2 style="margin:0">Klasa ${esc(c.name)}</h2><small>${db.students.filter(s=>s.classId===c.id).length} uczniów</small></div><button class="danger mini" onclick="removeClass('${c.id}')">Usuń</button></div><div class="row" style="margin-top:10px"><input id="student-${c.id}" placeholder="Imię i nazwisko ucznia"><button onclick="addStudent('${c.id}')">Dodaj</button></div>${db.students.filter(s=>s.classId===c.id).map(s=>`<div class="item row between"><div class="row"><div class="avatar">${esc(s.name.slice(0,1).toUpperCase())}</div><b>${esc(s.name)}</b></div><button class="danger mini" onclick="removeStudent('${s.id}')">×</button></div>`).join('')||'<div class="empty">Brak uczniów</div>'}</div>`).join('')||'<div class="card empty">Najpierw dodaj klasę.</div>'}`}
function addClass(){let v=$('#className').value.trim();if(!v)return;db.classes.push({id:id(),name:v});save();classes()}function removeClass(cid){if(!confirm('Usunąć klasę i jej dane?'))return;let ids=db.students.filter(s=>s.classId===cid).map(s=>s.id);db.classes=db.classes.filter(c=>c.id!==cid);db.students=db.students.filter(s=>s.classId!==cid);db.grades=db.grades.filter(g=>!ids.includes(g.studentId));db.attendance=db.attendance.filter(a=>!ids.includes(a.studentId));save();classes()}function addStudent(cid){let e=$('#student-'+cid),v=e.value.trim();if(!v)return;db.students.push({id:id(),classId:cid,name:v});save();classes()}function removeStudent(sid){db.students=db.students.filter(s=>s.id!==sid);db.grades=db.grades.filter(g=>g.studentId!==sid);db.attendance=db.attendance.filter(a=>a.studentId!==sid);save();classes()}
function studentOptions(){return db.students.map(s=>{let c=db.classes.find(x=>x.id===s.classId);return `<option value="${s.id}">${esc(s.name)} (${esc(c?.name||'?')})</option>`}).join('')}
function uniqueSubjects(){return [...new Set(db.grades.map(g=>g.subject.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'))}
function weightedAverage(list){let w=list.reduce((a,g)=>a+Number(g.weight||1),0);return w?list.reduce((a,g)=>a+Number(g.value)*Number(g.weight||1),0)/w:null}
function grades(){setHead('Oceny',db.school);let edit=editingGradeId?db.grades.find(g=>g.id===editingGradeId):null;let selectedStudent=sessionStorage.getItem('gradeStudent')||'';let selectedSubject=sessionStorage.getItem('gradeSubject')||'';let filtered=db.grades.filter(g=>(!selectedStudent||g.studentId===selectedStudent)&&(!selectedSubject||g.subject===selectedSubject));let grouped={};filtered.forEach(g=>(grouped[g.subject]??=[]).push(g));let student=selectedStudent?db.students.find(s=>s.id===selectedStudent):null;app.innerHTML=`<div class="card"><h2>${edit?'Edytuj ocenę':'Dodaj ocenę'}</h2><select id="gStudent"><option value="">Wybierz ucznia</option>${studentOptions()}</select><div class="grid"><input id="gSubject" list="subjectList" placeholder="Przedmiot"><select id="gValue">${[1,2,3,4,5,6].map(v=>`<option ${String(edit?.value)===String(v)?'selected':''}>${v}</option>`).join('')}</select></div><datalist id="subjectList">${uniqueSubjects().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="grid"><select id="gWeight">${[1,2,3,4,5,6].map(w=>`<option value="${w}" ${Number(edit?.weight||1)===w?'selected':''}>Waga ${w}</option>`).join('')}</select><input id="gNote" placeholder="Opis, np. sprawdzian" value="${esc(edit?.note||'')}"></div><button style="width:100%;margin-top:6px" onclick="saveGrade()">${edit?'Zapisz zmiany':'Dodaj ocenę'}</button>${edit?'<button class="secondary" style="width:100%;margin-top:7px" onclick="cancelGradeEdit()">Anuluj edycję</button>':''}</div>
<div class="card"><div class="row between"><h2 style="margin:0">Dziennik ocen</h2><span class="badge">średnia ważona</span></div><div class="filterbar"><select id="gradeFilterStudent" onchange="setGradeFilter()"><option value="">Wszyscy uczniowie</option>${studentOptions()}</select><select id="gradeFilterSubject" onchange="setGradeFilter()"><option value="">Wszystkie przedmioty</option>${uniqueSubjects().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>${student?`<div class="warn">Pokazujesz oceny ucznia: <b>${esc(student.name)}</b></div>`:''}${Object.keys(grouped).sort((a,b)=>a.localeCompare(b,'pl')).map(subject=>{let list=grouped[subject],avg=weightedAverage(list);return `<div class="subject-card"><div class="subject-head"><div><b>${esc(subject)}</b><br><small>${list.length} ${list.length===1?'ocena':'ocen'}</small></div><div class="subject-avg">${avg?.toFixed(2)||'—'}</div></div>${list.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(g=>{let st=db.students.find(x=>x.id===g.studentId);return `<div class="item row"><div class="grade">${esc(g.value)}</div><div style="flex:1"><b>${esc(st?.name||'Usunięty uczeń')}</b><br><small>${esc(g.note||'bez opisu')} · waga ${g.weight||1} · ${new Date(g.date).toLocaleDateString('pl-PL')}</small></div><div class="actions"><button class="secondary mini" onclick="editGrade('${g.id}')">Edytuj</button><button class="danger mini" onclick="delGrade('${g.id}')">×</button></div></div>`}).join('')}</div>`}).join('')||'<div class="empty">Brak ocen dla wybranych filtrów</div>'}</div>
<div class="card"><h2>Kalkulator wymaganej oceny</h2><p class="muted">Oblicza, jaką ocenę trzeba zdobyć, aby osiągnąć wybraną średnią ważoną.</p><select id="calcStudent"><option value="">Wybierz ucznia</option>${studentOptions()}</select><select id="calcSubject"><option value="">Wybierz przedmiot</option>${uniqueSubjects().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><div class="grid"><input id="calcTarget" type="number" min="1" max="6" step="0.01" placeholder="Docelowa średnia, np. 4.75"><select id="calcWeight">${[1,2,3,4,5,6].map(w=>`<option value="${w}">Waga nowej oceny: ${w}</option>`).join('')}</select></div><button style="width:100%;margin-top:6px" onclick="calculateNeededGrade()">Oblicz</button><div id="calcOutput"></div></div>`;setTimeout(()=>{if($('#gStudent'))$('#gStudent').value=edit?.studentId||selectedStudent;if($('#gSubject'))$('#gSubject').value=edit?.subject||selectedSubject;if($('#gradeFilterStudent'))$('#gradeFilterStudent').value=selectedStudent;if($('#gradeFilterSubject'))$('#gradeFilterSubject').value=selectedSubject},0)}
function saveGrade(){let studentId=$('#gStudent').value,subject=$('#gSubject').value.trim(),value=$('#gValue').value,weight=Number($('#gWeight').value),note=$('#gNote').value.trim();if(!studentId||!subject)return toast('Wybierz ucznia i przedmiot');if(editingGradeId){let g=db.grades.find(x=>x.id===editingGradeId);if(g)Object.assign(g,{studentId,subject,value,weight,note});editingGradeId=null;toast('Ocena zmieniona')}else{db.grades.push({id:id(),studentId,subject,value,weight,note,date:new Date().toISOString()});toast('Ocena dodana')}save();grades()}
function editGrade(i){editingGradeId=i;grades();window.scrollTo(0,0)}function cancelGradeEdit(){editingGradeId=null;grades()}function delGrade(i){if(!confirm('Usunąć tę ocenę?'))return;db.grades=db.grades.filter(g=>g.id!==i);if(editingGradeId===i)editingGradeId=null;save();grades()}
function setGradeFilter(){sessionStorage.setItem('gradeStudent',$('#gradeFilterStudent').value);sessionStorage.setItem('gradeSubject',$('#gradeFilterSubject').value);grades()}
function calculateNeededGrade(){let sid=$('#calcStudent').value,subject=$('#calcSubject').value,target=Number($('#calcTarget').value),newWeight=Number($('#calcWeight').value),out=$('#calcOutput');if(!sid||!subject||!target)return toast('Uzupełnij ucznia, przedmiot i średnią');let list=db.grades.filter(g=>g.studentId===sid&&g.subject===subject),sum=list.reduce((a,g)=>a+Number(g.value)*Number(g.weight||1),0),weights=list.reduce((a,g)=>a+Number(g.weight||1),0),current=weights?sum/weights:0,needed=(target*(weights+newWeight)-sum)/newWeight;let text;if(needed<=1)text=`Wystarczy ocena <b>1</b> lub wyższa.`;else if(needed>6)text=`Jedna ocena z wagą ${newWeight} nie wystarczy — potrzeba matematycznie <b>${needed.toFixed(2)}</b>.`;else text=`Potrzebujesz co najmniej <b>${Math.ceil(needed)}</b> <small>(dokładnie ${needed.toFixed(2)})</small>.`;out.innerHTML=`<div class="calc-result"><small>Obecna średnia: ${current?current.toFixed(2):'brak ocen'}</small>${text}</div>`}
let editingTaskId=null;
function taskDateLabel(d){if(!d)return 'Brak terminu';let date=new Date(d+'T12:00:00'),today=new Date();today.setHours(0,0,0,0);let tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);if(date.getTime()===today.getTime())return 'Dzisiaj';if(date.getTime()===tomorrow.getTime())return 'Jutro';return date.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'})}
function tasks(){setHead('Zadania i sprawdziany',db.school);let edit=db.tasks.find(t=>t.id===editingTaskId),filter=sessionStorage.getItem('taskFilter')||'open',today=new Date().toISOString().slice(0,10),list=db.tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done)).sort((a,b)=>(a.done-b.done)||a.due.localeCompare(b.due));app.innerHTML=`<div class="card"><h2>${edit?'Edytuj termin':'Dodaj termin'}</h2><input id="tTitle" placeholder="Nazwa, np. ćwiczenia str. 42" value="${esc(edit?.title||'')}"><div class="grid"><input id="tSubject" list="subjectList" placeholder="Przedmiot" value="${esc(edit?.subject||'')}"><input id="tDue" type="date" value="${esc(edit?.due||today)}"></div><datalist id="subjectList">${uniqueSubjects().map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="grid"><select id="tType">${['Zadanie domowe','Sprawdzian','Kartkówka','Projekt','Inne'].map(x=>`<option ${edit?.type===x?'selected':''}>${x}</option>`).join('')}</select><select id="tPriority">${['Niski','Normalny','Wysoki'].map(x=>`<option ${edit?.priority===x?'selected':''}>Priorytet: ${x}</option>`).join('')}</select></div><textarea id="tNote" rows="3" placeholder="Notatka (opcjonalnie)">${esc(edit?.note||'')}</textarea><button style="width:100%;margin-top:6px" onclick="saveTask()">${edit?'Zapisz zmiany':'Dodaj termin'}</button>${edit?'<button class="secondary" style="width:100%;margin-top:7px" onclick="cancelTaskEdit()">Anuluj edycję</button>':''}</div><div class="card"><div class="row between"><h2 style="margin:0">Lista terminów</h2><span class="badge">${db.tasks.filter(t=>!t.done).length} aktywnych</span></div><select id="taskFilter" onchange="setTaskFilter(this.value)"><option value="open" ${filter==='open'?'selected':''}>Do zrobienia</option><option value="done" ${filter==='done'?'selected':''}>Ukończone</option><option value="all" ${filter==='all'?'selected':''}>Wszystkie</option></select>${list.map(t=>{let overdue=!t.done&&t.due<today;return `<div class="item ${overdue?'task-overdue':''} ${t.done?'task-done':''}"><div class="row"><button class="secondary mini" onclick="toggleTask('${t.id}')">${t.done?'↩':'✓'}</button><div style="flex:1"><div class="row" style="flex-wrap:wrap"><span class="task-type">${esc(t.type)}</span><b>${esc(t.title)}</b>${t.priority==='Wysoki'?'<span class="badge">Ważne</span>':''}</div><small>${esc(t.subject||'Bez przedmiotu')}${t.note?' · '+esc(t.note):''}</small><br><span class="task-date ${overdue?'overdue':''}">${overdue?'Po terminie: ':''}${taskDateLabel(t.due)}</span></div><div class="actions"><button class="secondary mini" onclick="editTask('${t.id}')">Edytuj</button><button class="danger mini" onclick="deleteTask('${t.id}')">×</button></div></div></div>`}).join('')||'<div class="empty">Brak terminów w tym widoku</div>'}</div>`}
function saveTask(){let title=$('#tTitle').value.trim(),subject=$('#tSubject').value.trim(),due=$('#tDue').value,type=$('#tType').value,priority=$('#tPriority').value,note=$('#tNote').value.trim();if(!title||!due)return toast('Wpisz nazwę i termin');if(editingTaskId){let t=db.tasks.find(x=>x.id===editingTaskId);if(t)Object.assign(t,{title,subject,due,type,priority,note});editingTaskId=null;toast('Termin zmieniony')}else{db.tasks.push({id:id(),title,subject,due,type,priority,note,done:false,created:new Date().toISOString()});toast('Termin dodany')}save();tasks()}
function editTask(i){editingTaskId=i;tasks();window.scrollTo(0,0)}function cancelTaskEdit(){editingTaskId=null;tasks()}function toggleTask(i){let t=db.tasks.find(x=>x.id===i);if(t){t.done=!t.done;save();tasks();toast(t.done?'Oznaczono jako wykonane':'Przywrócono termin')}}function deleteTask(i){if(!confirm('Usunąć ten termin?'))return;db.tasks=db.tasks.filter(t=>t.id!==i);if(editingTaskId===i)editingTaskId=null;save();tasks()}function setTaskFilter(v){sessionStorage.setItem('taskFilter',v);tasks()}
function attendance(){setHead('Frekwencja',db.school);app.innerHTML=`<div class="card"><h2>Dodaj wpis</h2><select id="aStudent"><option value="">Wybierz ucznia</option>${studentOptions()}</select><div class="grid"><input id="aDate" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="aState"><option>Obecny</option><option>Nieobecny</option><option>Spóźniony</option><option>Usprawiedliwiony</option></select></div><button style="width:100%;margin-top:6px" onclick="addAttendance()">Zapisz</button></div><div class="card"><h2>Historia</h2>${db.attendance.slice().reverse().map(a=>{let s=db.students.find(x=>x.id===a.studentId);return `<div class="item row between"><div><b>${esc(s?.name||'Usunięty uczeń')}</b><br><small>${esc(a.date)} · ${esc(a.state)}</small></div><button class="danger mini" onclick="delAttendance('${a.id}')">×</button></div>`}).join('')||'<div class="empty">Brak wpisów</div>'}</div>`}
function addAttendance(){let studentId=$('#aStudent').value,date=$('#aDate').value,state=$('#aState').value;if(!studentId)return toast('Wybierz ucznia');db.attendance.push({id:id(),studentId,date,state});save();attendance();toast('Frekwencja zapisana')}function delAttendance(i){db.attendance=db.attendance.filter(a=>a.id!==i);save();attendance()}
const days=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek'];
function plan(){setHead('Plan lekcji',db.school);app.innerHTML=`<div class="card"><h2>Dodaj lekcję</h2><select id="pDay">${days.map(d=>`<option>${d}</option>`).join('')}</select><div class="grid"><input id="pTime" type="time"><input id="pSubject" placeholder="Przedmiot"></div><input id="pRoom" placeholder="Sala / nauczyciel (opcjonalnie)"><button style="width:100%;margin-top:6px" onclick="addLesson()">Dodaj do planu</button></div><div class="card"><h2>Twój plan</h2>${days.map(d=>`<div class="day">${d}</div>${db.lessons.filter(l=>l.day===d).sort((a,b)=>a.time.localeCompare(b.time)).map(l=>`<div class="item lesson"><div class="time">${esc(l.time)}</div><div style="flex:1"><b>${esc(l.subject)}</b><br><small>${esc(l.room||'')}</small></div><button class="danger mini" onclick="delLesson('${l.id}')">×</button></div>`).join('')||'<small>Brak lekcji</small>'}`).join('')}</div>`}
function addLesson(){let day=$('#pDay').value,time=$('#pTime').value,subject=$('#pSubject').value.trim(),room=$('#pRoom').value.trim();if(!time||!subject)return toast('Uzupełnij godzinę i przedmiot');db.lessons.push({id:id(),day,time,subject,room});save();plan()}function delLesson(i){db.lessons=db.lessons.filter(l=>l.id!==i);save();plan()}
function settings(){setHead('Ustawienia',db.school);let dark=localStorage.getItem('wolfEduTheme')==='dark';app.innerHTML=`<div class="card"><h2>Synchronizacja WolfCloud</h2><div class="sync-box">${syncLoggedIn?`<div class="sync-state"><span class="bigdot ${syncState}"></span><div><b>${esc(syncTitle)}</b><br><small>${esc(syncDetail)}</small></div></div><div class="sync-email">${esc(syncEmail)}</div><div class="sync-actions"><button onclick="syncNow()">Synchronizuj teraz</button><button class="secondary" onclick="logoutSync()">Wyloguj</button></div><div class="sync-note">Zmiany są zapisywane lokalnie i wysyłane do chmury. Po zalogowaniu na drugim telefonie użyj tego samego konta.</div>`:`<div class="sync-state"><span class="bigdot"></span><div><b>Połącz urządzenia</b><br><small>Zaloguj się lub utwórz darmowe konto.</small></div></div><input id="syncEmail" type="email" autocomplete="email" placeholder="Adres e-mail"><input id="syncPassword" type="password" autocomplete="current-password" placeholder="Hasło (minimum 6 znaków)"><div class="sync-actions"><button onclick="loginSync()">Zaloguj</button><button class="secondary" onclick="registerSync()">Utwórz konto</button></div><div class="sync-note">Hasło obsługuje Firebase Authentication. WolfEdu nie zapisuje go w danych dziennika.</div>`}</div></div><div class="card"><h2>Wygląd</h2><div class="switch"><div><b>Tryb ciemny</b><br><small>Przyciemnia interfejs aplikacji</small></div><button class="secondary" onclick="toggleTheme()">${dark?'Wyłącz':'Włącz'}</button></div></div><div class="card"><h2>Nazwa szkoły</h2><input id="sName" value="${esc(db.school)}"><button onclick="renameSchool()">Zapisz</button></div><div class="card"><h2>Kopia danych</h2><p class="muted">Eksport zapisuje kompletny dziennik do pliku JSON.</p><button onclick="exportData()">Eksportuj</button><label><input id="importFile" type="file" accept="application/json" style="margin-top:10px" onchange="importData(event)"></label></div><div class="card"><h2>Reset</h2><button class="danger" onclick="resetAll()">Usuń wszystkie dane lokalne</button></div><div class="version">WolfEdu 4.0.0 · Sync Beta</div>`}
function renameSchool(){let v=$('#sName').value.trim();if(v){db.school=v;save();settings();toast('Zapisano')}}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wolfedu-kopia.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render('home');toast('Kopia wczytana')}catch{toast('Nieprawidłowy plik')}};r.readAsText(f)}function resetAll(){if(confirm('Na pewno usunąć cały dziennik lokalnie i w chmurze?')){db={school:'',classes:[],students:[],grades:[],attendance:[],lessons:[],tasks:[],_sync:{updatedAt:Date.now()}};save();setup()}}

let syncLoggedIn=false,syncEmail='',syncState='offline',syncTitle='Tylko lokalnie',syncDetail='Zaloguj się, aby synchronizować.',syncTimer=null,applyingRemote=false;
function hasSyncBridge(){return typeof WolfSync!=='undefined'}
function updateSyncPill(){let pill=$('#syncPill'),txt=$('#syncPillText');if(!pill||!txt)return;pill.className='sync-pill '+syncState;txt.textContent=syncTitle}
function scheduleCloudSync(){if(applyingRemote||!syncLoggedIn||!hasSyncBridge())return;clearTimeout(syncTimer);syncState='syncing';syncTitle='Oczekuje na synchronizację';syncDetail='Zmiana zostanie wysłana automatycznie.';updateSyncPill();syncTimer=setTimeout(()=>WolfSync.syncData(JSON.stringify(db),Number(db?._sync?.updatedAt||Date.now())),650)}
function syncNow(){if(!syncLoggedIn)return toast('Najpierw się zaloguj');db._sync=db._sync||{};db._sync.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db));WolfSync.syncData(JSON.stringify(db),db._sync.updatedAt)}
function loginSync(){let e=$('#syncEmail')?.value.trim(),p=$('#syncPassword')?.value||'';if(!e||p.length<6)return toast('Wpisz e-mail i hasło min. 6 znaków');WolfSync.login(e,p);syncState='syncing';syncTitle='Logowanie…';updateSyncPill()}
function registerSync(){let e=$('#syncEmail')?.value.trim(),p=$('#syncPassword')?.value||'';if(!e||p.length<6)return toast('Wpisz e-mail i hasło min. 6 znaków');WolfSync.register(e,p);syncState='syncing';syncTitle='Tworzenie konta…';updateSyncPill()}
function logoutSync(){if(confirm('Wylogować z synchronizacji? Dane lokalne pozostaną na telefonie.'))WolfSync.logout()}
window.wolfSyncAuth=function(logged,email){syncLoggedIn=!!logged;syncEmail=email||'';syncState=logged?'online':'offline';syncTitle=logged?'Połączono':'Tylko lokalnie';syncDetail=logged?'Synchronizacja jest aktywna.':'Zaloguj się, aby synchronizować.';updateSyncPill();if(logged&&hasSyncBridge())WolfSync.requestRemoteData();if(currentPage==='settings')settings()}
window.wolfSyncStatus=function(title,detail,state){syncTitle=title||'Synchronizacja';syncDetail=detail||'';syncState=state||'offline';updateSyncPill();if(currentPage==='settings')settings()}
window.wolfSyncError=function(message){syncState='pending';syncTitle='Błąd synchronizacji';syncDetail=message||'Nie udało się połączyć.';updateSyncPill();toast(syncDetail);if(currentPage==='settings')settings()}
window.wolfSyncRemote=function(json,updatedAt){try{let remote=JSON.parse(json),localTime=Number(db?._sync?.updatedAt||0),remoteTime=Number(updatedAt||remote?._sync?.updatedAt||0);if(remoteTime>localTime){applyingRemote=true;db=remote;db._sync=db._sync||{};db._sync.updatedAt=remoteTime;localStorage.setItem(KEY,JSON.stringify(db));applyingRemote=false;render(currentPage||'home');toast('Pobrano nowsze dane z chmury')}syncState='online';syncTitle='Zsynchronizowano';syncDetail='Wszystkie zmiany są aktualne.';updateSyncPill()}catch(e){window.wolfSyncError('Nie udało się odczytać danych z chmury.')}}

migrate();
function applyTheme(){document.documentElement.dataset.theme=localStorage.getItem('wolfEduTheme')||'light'}function toggleTheme(){localStorage.setItem('wolfEduTheme',localStorage.getItem('wolfEduTheme')==='dark'?'light':'dark');applyTheme();settings()}applyTheme();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));render();if(hasSyncBridge())setTimeout(()=>WolfSync.requestRemoteData(),450);setTimeout(()=>document.getElementById('splash')?.classList.add('hide'),700);
</script></body></html>
