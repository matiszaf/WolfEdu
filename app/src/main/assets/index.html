<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mój Dziennik</title>
<style>
:root{--p:#5b4bff;--p2:#7c4dff;--bg:#f4f5fa;--card:#fff;--text:#1d2330;--muted:#717785;--danger:#d83a52;--ok:#16865c;--line:#e7e8ef}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #4b3cff33}header h1{margin:0;font-size:23px}header p{margin:4px 0 0;opacity:.86;font-size:13px}
main{padding:14px 14px 92px;max-width:720px;margin:auto}.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 3px 16px #2028450c;border:1px solid #fff}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font-size:18px;margin:2px 0 12px}h3{font-size:15px;margin:0 0 7px}small,.muted{color:var(--muted)}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit;outline:none;margin:5px 0}input:focus,select:focus,textarea:focus{border-color:var(--p)}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--p);color:white}button.secondary{background:#eceafd;color:var(--p)}button.danger{background:#ffe8ec;color:var(--danger)}button.mini{padding:7px 10px;font-size:12px}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.badge{padding:4px 8px;border-radius:999px;background:#eceafd;color:var(--p);font-weight:700;font-size:12px}.grade{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#eceafd;color:var(--p);font-weight:800;font-size:17px}.empty{text-align:center;padding:22px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:9;padding-bottom:max(6px,env(safe-area-inset-bottom))}nav button{background:white;color:var(--muted);border-radius:0;padding:9px 2px 7px;font-size:10px;font-weight:600}nav button.active{color:var(--p)}nav .ico{font-size:19px;display:block;margin-bottom:2px}.hidden{display:none!important}.stat{padding:12px;border-radius:14px;background:#f1efff}.stat b{display:block;font-size:22px;color:var(--p)}.day{font-weight:800;margin:13px 0 5px}.lesson{display:flex;gap:10px;align-items:center}.time{font-weight:700;color:var(--p);min-width:48px}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1d2330;color:white;padding:10px 14px;border-radius:12px;z-index:20;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.setup{min-height:75vh;display:grid;place-items:center}.setup .card{width:100%;max-width:460px}.avatar{width:42px;height:42px;border-radius:13px;background:#eceafd;display:grid;place-items:center;font-weight:800;color:var(--p)}
</style>
</head>
<body>
<header><h1 id="headTitle">Mój Dziennik</h1><p id="headSub">Twój prywatny dziennik szkolny</p></header>
<main id="app"></main>
<nav id="nav" class="hidden">
<button data-page="home"><span class="ico">🏠</span>Start</button><button data-page="classes"><span class="ico">👥</span>Klasy</button><button data-page="grades"><span class="ico">⭐</span>Oceny</button><button data-page="attendance"><span class="ico">✅</span>Frekw.</button><button data-page="plan"><span class="ico">📅</span>Plan</button><button data-page="settings"><span class="ico">⚙️</span>Opcje</button>
</nav><div id="toast" class="toast"></div>
<script>
const KEY='mojDziennikDataV1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{school:'',classes:[],students:[],grades:[],attendance:[],lessons:[]};
let page='home'; const $=s=>document.querySelector(s); const app=$('#app');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function setHead(t,s){$('#headTitle').textContent=t;$('#headSub').textContent=s||db.school}
function setup(){setHead('Mój Dziennik','Pierwsza konfiguracja');$('#nav').classList.add('hidden');app.innerHTML=`<section class="setup"><div class="card"><h2>Utwórz swoją szkołę</h2><p class="muted">Dane zostają wyłącznie na tym telefonie.</p><input id="school" placeholder="Nazwa szkoły, np. SP 35 w Gdyni"><button style="width:100%;margin-top:8px" onclick="createSchool()">Utwórz dziennik</button></div></section>`}
function createSchool(){let v=$('#school').value.trim();if(!v)return toast('Wpisz nazwę szkoły');db.school=v;save();render('home')}
function render(p=page){page=p;if(!db.school)return setup();$('#nav').classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({home,classes,grades,attendance,plan,settings}[page]||home)()}
function home(){setHead(db.school,'Panel główny');let avg=db.grades.length?(db.grades.reduce((a,g)=>a+Number(g.value),0)/db.grades.length).toFixed(2):'—';app.innerHTML=`<div class="grid"><div class="stat"><small>Klasy</small><b>${db.classes.length}</b></div><div class="stat"><small>Uczniowie</small><b>${db.students.length}</b></div><div class="stat"><small>Oceny</small><b>${db.grades.length}</b></div><div class="stat"><small>Średnia ocen</small><b>${avg}</b></div></div><div class="card" style="margin-top:12px"><h2>Ostatnie oceny</h2>${db.grades.slice(-5).reverse().map(g=>{let s=db.students.find(x=>x.id===g.studentId);return `<div class="item row"><div class="grade">${esc(g.value)}</div><div><b>${esc(s?.name||'Usunięty uczeń')}</b><br><small>${esc(g.subject)} · ${esc(g.note||'bez opisu')}</small></div></div>`}).join('')||'<div class="empty">Brak ocen</div>'}</div>`}
function classes(){setHead('Klasy i uczniowie',db.school);app.innerHTML=`<div class="card"><h2>Dodaj klasę</h2><div class="row"><input id="className" placeholder="np. 8B"><button onclick="addClass()">Dodaj</button></div></div>${db.classes.map(c=>`<div class="card"><div class="row between"><div><h2 style="margin:0">Klasa ${esc(c.name)}</h2><small>${db.students.filter(s=>s.classId===c.id).length} uczniów</small></div><button class="danger mini" onclick="removeClass('${c.id}')">Usuń</button></div><div class="row" style="margin-top:10px"><input id="student-${c.id}" placeholder="Imię i nazwisko ucznia"><button onclick="addStudent('${c.id}')">Dodaj</button></div>${db.students.filter(s=>s.classId===c.id).map(s=>`<div class="item row between"><div class="row"><div class="avatar">${esc(s.name.slice(0,1).toUpperCase())}</div><b>${esc(s.name)}</b></div><button class="danger mini" onclick="removeStudent('${s.id}')">×</button></div>`).join('')||'<div class="empty">Brak uczniów</div>'}</div>`).join('')||'<div class="card empty">Najpierw dodaj klasę.</div>'}`}
function addClass(){let v=$('#className').value.trim();if(!v)return;db.classes.push({id:id(),name:v});save();classes()}function removeClass(cid){if(!confirm('Usunąć klasę i jej dane?'))return;let ids=db.students.filter(s=>s.classId===cid).map(s=>s.id);db.classes=db.classes.filter(c=>c.id!==cid);db.students=db.students.filter(s=>s.classId!==cid);db.grades=db.grades.filter(g=>!ids.includes(g.studentId));db.attendance=db.attendance.filter(a=>!ids.includes(a.studentId));save();classes()}function addStudent(cid){let e=$('#student-'+cid),v=e.value.trim();if(!v)return;db.students.push({id:id(),classId:cid,name:v});save();classes()}function removeStudent(sid){db.students=db.students.filter(s=>s.id!==sid);db.grades=db.grades.filter(g=>g.studentId!==sid);db.attendance=db.attendance.filter(a=>a.studentId!==sid);save();classes()}
function studentOptions(){return db.students.map(s=>{let c=db.classes.find(x=>x.id===s.classId);return `<option value="${s.id}">${esc(s.name)} (${esc(c?.name||'?')})</option>`}).join('')}
function grades(){setHead('Oceny',db.school);app.innerHTML=`<div class="card"><h2>Dodaj ocenę</h2><select id="gStudent"><option value="">Wybierz ucznia</option>${studentOptions()}</select><div class="grid"><input id="gSubject" placeholder="Przedmiot"><select id="gValue"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div><input id="gNote" placeholder="Opis, np. sprawdzian"><button style="width:100%;margin-top:6px" onclick="addGrade()">Zapisz ocenę</button></div><div class="card"><h2>Wszystkie oceny</h2>${db.grades.slice().reverse().map(g=>{let s=db.students.find(x=>x.id===g.studentId);return `<div class="item row between"><div class="row"><div class="grade">${esc(g.value)}</div><div><b>${esc(s?.name||'Usunięty uczeń')}</b><br><small>${esc(g.subject)} · ${esc(g.note||'bez opisu')} · ${new Date(g.date).toLocaleDateString('pl-PL')}</small></div></div><button class="danger mini" onclick="delGrade('${g.id}')">×</button></div>`}).join('')||'<div class="empty">Brak ocen</div>'}</div>`}
function addGrade(){let studentId=$('#gStudent').value,subject=$('#gSubject').value.trim(),value=$('#gValue').value,note=$('#gNote').value.trim();if(!studentId||!subject)return toast('Wybierz ucznia i przedmiot');db.grades.push({id:id(),studentId,subject,value,note,date:new Date().toISOString()});save();grades();toast('Ocena dodana')}function delGrade(i){db.grades=db.grades.filter(g=>g.id!==i);save();grades()}
function attendance(){setHead('Frekwencja',db.school);app.innerHTML=`<div class="card"><h2>Dodaj wpis</h2><select id="aStudent"><option value="">Wybierz ucznia</option>${studentOptions()}</select><div class="grid"><input id="aDate" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="aState"><option>Obecny</option><option>Nieobecny</option><option>Spóźniony</option><option>Usprawiedliwiony</option></select></div><button style="width:100%;margin-top:6px" onclick="addAttendance()">Zapisz</button></div><div class="card"><h2>Historia</h2>${db.attendance.slice().reverse().map(a=>{let s=db.students.find(x=>x.id===a.studentId);return `<div class="item row between"><div><b>${esc(s?.name||'Usunięty uczeń')}</b><br><small>${esc(a.date)} · ${esc(a.state)}</small></div><button class="danger mini" onclick="delAttendance('${a.id}')">×</button></div>`}).join('')||'<div class="empty">Brak wpisów</div>'}</div>`}
function addAttendance(){let studentId=$('#aStudent').value,date=$('#aDate').value,state=$('#aState').value;if(!studentId)return toast('Wybierz ucznia');db.attendance.push({id:id(),studentId,date,state});save();attendance();toast('Frekwencja zapisana')}function delAttendance(i){db.attendance=db.attendance.filter(a=>a.id!==i);save();attendance()}
const days=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek'];
function plan(){setHead('Plan lekcji',db.school);app.innerHTML=`<div class="card"><h2>Dodaj lekcję</h2><select id="pDay">${days.map(d=>`<option>${d}</option>`).join('')}</select><div class="grid"><input id="pTime" type="time"><input id="pSubject" placeholder="Przedmiot"></div><input id="pRoom" placeholder="Sala / nauczyciel (opcjonalnie)"><button style="width:100%;margin-top:6px" onclick="addLesson()">Dodaj do planu</button></div><div class="card"><h2>Twój plan</h2>${days.map(d=>`<div class="day">${d}</div>${db.lessons.filter(l=>l.day===d).sort((a,b)=>a.time.localeCompare(b.time)).map(l=>`<div class="item lesson"><div class="time">${esc(l.time)}</div><div style="flex:1"><b>${esc(l.subject)}</b><br><small>${esc(l.room||'')}</small></div><button class="danger mini" onclick="delLesson('${l.id}')">×</button></div>`).join('')||'<small>Brak lekcji</small>'}`).join('')}</div>`}
function addLesson(){let day=$('#pDay').value,time=$('#pTime').value,subject=$('#pSubject').value.trim(),room=$('#pRoom').value.trim();if(!time||!subject)return toast('Uzupełnij godzinę i przedmiot');db.lessons.push({id:id(),day,time,subject,room});save();plan()}function delLesson(i){db.lessons=db.lessons.filter(l=>l.id!==i);save();plan()}
function settings(){setHead('Ustawienia',db.school);app.innerHTML=`<div class="card"><h2>Nazwa szkoły</h2><input id="sName" value="${esc(db.school)}"><button onclick="renameSchool()">Zapisz</button></div><div class="card"><h2>Kopia danych</h2><p class="muted">Eksport zapisuje kompletny dziennik do pliku tekstowego JSON.</p><button onclick="exportData()">Eksportuj</button><label><input id="importFile" type="file" accept="application/json" style="margin-top:10px" onchange="importData(event)"></label></div><div class="card"><h2>Reset</h2><button class="danger" onclick="resetAll()">Usuń wszystkie dane</button></div>`}
function renameSchool(){let v=$('#sName').value.trim();if(v){db.school=v;save();settings();toast('Zapisano')}}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moj-dziennik-kopia.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render('home');toast('Kopia wczytana')}catch{toast('Nieprawidłowy plik')}};r.readAsText(f)}function resetAll(){if(confirm('Na pewno usunąć cały dziennik?')){localStorage.removeItem(KEY);db={school:'',classes:[],students:[],grades:[],attendance:[],lessons:[]};setup()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));render();
</script></body></html>
