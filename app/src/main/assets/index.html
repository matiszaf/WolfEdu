<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WolfEdu</title>
<style>
:root{
 --primary:#415f91;--on-primary:#fff;--primary-container:#d6e3ff;--on-primary-container:#001b3e;
 --secondary:#565f71;--secondary-container:#dae2f9;--tertiary:#705575;--tertiary-container:#fad8fd;
 --surface:#f9f9ff;--surface-container:#eef0f8;--surface-high:#e8eaf2;--card:#fff;
 --text:#191c20;--muted:#44474e;--outline:#74777f;--line:#c5c6d0;--danger:#ba1a1a;--danger-container:#ffdad6;
 --ok:#2e6b48;--shadow:#00000016;--radius:24px
}
html[data-theme='dark']{
 --primary:#aac7ff;--on-primary:#0a305f;--primary-container:#284777;--on-primary-container:#d6e3ff;
 --secondary:#bec6dc;--secondary-container:#3e4759;--tertiary:#ddbce0;--tertiary-container:#573e5c;
 --surface:#111318;--surface-container:#1d2026;--surface-high:#272a30;--card:#1b1e24;
 --text:#e2e2e9;--muted:#c4c6d0;--outline:#8e9099;--line:#44474f;--danger:#ffb4ab;--danger-container:#93000a;
 --ok:#91d5a8;--shadow:#00000055
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--surface)}body{margin:0;font-family:Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--surface);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:7;background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(18px);padding:16px 20px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
header h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.4px}header p{margin:5px 0 0;color:var(--muted);font-size:13px}
main{padding:16px 16px 106px;max-width:760px;margin:auto}.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--line) 40%,transparent);box-shadow:0 1px 2px var(--shadow)}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}h2{font-size:20px;margin:2px 0 14px;letter-spacing:-.2px}h3{font-size:16px;margin:0 0 8px}small,.muted{color:var(--muted);line-height:1.4}
input,select,textarea{width:100%;min-height:52px;padding:13px 15px;border:1px solid var(--outline);border-radius:16px;background:transparent;color:var(--text);font:inherit;outline:none;margin:6px 0}input:focus,select:focus,textarea:focus{border:2px solid var(--primary);padding:12px 14px}textarea{min-height:92px;resize:vertical}
button{min-height:44px;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:650;background:var(--primary);color:var(--on-primary);cursor:pointer}button:active{transform:scale(.985)}button:disabled,.btn-busy{opacity:.55;pointer-events:none}button.secondary{background:var(--secondary-container);color:var(--text)}button.danger{background:var(--danger-container);color:var(--danger)}button.mini{min-height:34px;padding:6px 12px;font-size:12px}.btn-full{width:100%}.linkbtn{background:transparent;color:var(--primary);padding:8px 10px;min-height:36px}
.item{padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}.item:last-child{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--primary-container);color:var(--on-primary-container);font-weight:700;font-size:12px}.empty{text-align:center;padding:28px 12px;color:var(--muted)}
nav{position:fixed;left:10px;right:10px;bottom:10px;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface-container) 96%,transparent);backdrop-filter:blur(20px);border:1px solid color-mix(in srgb,var(--line) 50%,transparent);border-radius:28px;padding:7px 6px max(7px,env(safe-area-inset-bottom));box-shadow:0 8px 28px #0002}
nav button{background:transparent;color:var(--muted);border-radius:20px;padding:6px 2px;min-height:58px;font-size:11px;font-weight:650}nav button.active{color:var(--on-primary-container);background:var(--primary-container)}nav .ico{display:block;font-size:20px;margin:0 auto 3px}
.hidden{display:none!important}.hero{background:linear-gradient(145deg,var(--primary-container),color-mix(in srgb,var(--tertiary-container) 60%,var(--primary-container)));color:var(--on-primary-container);border:0;position:relative;overflow:hidden;box-shadow:none}.hero:after{content:'W';position:absolute;right:-14px;bottom:-52px;font-size:150px;font-weight:800;opacity:.07}.hero small{color:color-mix(in srgb,var(--on-primary-container) 72%,transparent)}.hero h2{font-size:28px;margin:6px 0 10px}.brand-pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--card) 45%,transparent);font-size:12px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quick button{min-height:112px;border-radius:22px;background:var(--surface-container);color:var(--text);text-align:left;padding:16px;border:1px solid color-mix(in srgb,var(--line) 35%,transparent)}.quick .qico{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--primary-container);font-size:20px;margin-bottom:12px}.quick small{display:block;margin-top:4px}.stat{padding:16px;border-radius:22px;background:var(--surface-container)}.stat b{display:block;font-size:28px;color:var(--primary);margin-top:3px}.progress{height:8px;background:var(--surface-high);border-radius:99px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:var(--primary);border-radius:99px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 3px 11px}.section-title h2{margin:0}
.avatar{width:46px;height:46px;border-radius:16px;background:var(--primary-container);display:grid;place-items:center;color:var(--on-primary-container);font-weight:800}.warn{background:var(--tertiary-container);color:var(--text);padding:12px 14px;border-radius:18px;font-size:13px;line-height:1.45}.day{font-weight:800;font-size:14px;margin:18px 0 5px;color:var(--primary)}.lesson{display:flex;gap:12px}.time{min-width:54px;font-weight:800;color:var(--primary)}
.sync-pill{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:7px 11px;border-radius:999px;background:var(--surface-container);font-size:12px;font-weight:700;color:var(--muted)}.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--outline)}.sync-pill.online .sync-dot{background:var(--ok)}.sync-pill.syncing .sync-dot{background:#f2b544;animation:pulse 1s infinite}.sync-pill.pending .sync-dot{background:#e47b45}.sync-box{border-radius:22px;padding:15px;background:var(--surface-container)}.sync-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.sync-email{font-weight:700;color:var(--primary);word-break:break-all}.sync-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}.sync-state{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}.sync-state .bigdot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--outline)}.sync-state .bigdot.online{background:var(--ok)}.sync-state .bigdot.syncing{background:#f2b544}.sync-state .bigdot.pending{background:#e47b45}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(12px);background:#303036;color:white;padding:11px 16px;border-radius:14px;z-index:30;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.splash{position:fixed;inset:0;z-index:999;background:var(--surface);display:grid;place-items:center;transition:opacity .35s,visibility .35s}.splash.hide{opacity:0;visibility:hidden}.splash-logo{width:88px;height:88px;border-radius:28px;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;font-size:42px;font-weight:800}.splash h1{font-size:32px;margin:16px 0 4px}.splash p{margin:0;color:var(--muted)}.setup{min-height:68vh;display:grid;place-items:center}.setup .card{width:100%;max-width:480px}.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}.version{text-align:center;color:var(--muted);font-size:12px;padding:10px}.task-type,.task-date{font-weight:700}.task-type{font-size:11px;background:var(--secondary-container);padding:5px 8px;border-radius:999px}.task-overdue{border-left:4px solid var(--danger);padding-left:12px}.task-done{opacity:.6}.task-done b{text-decoration:line-through}@keyframes pulse{50%{opacity:.35}}
@media(max-width:390px){main{padding-left:12px;padding-right:12px}.quick{gap:9px}.grid{grid-template-columns:1fr}.sync-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="splash" class="splash"><div style="text-align:center"><div class="splash-logo">W</div><h1>WolfEdu</h1><p>Szkoła pod kontrolą</p></div></div>
<header><h1 id="headTitle">WolfEdu</h1><p id="headSub">Twój inteligentny dziennik szkolny</p><div id="syncPill" class="sync-pill"><span class="sync-dot"></span><span id="syncPillText">Tylko lokalnie</span></div></header>
<main id="app"></main>
<nav id="nav" class="hidden">
<button data-page="home"><span class="ico">⌂</span>Start</button>
<button data-page="grades"><span class="ico">★</span>Oceny</button>
<button data-page="tasks"><span class="ico">✓</span>Zadania</button>
<button data-page="plan"><span class="ico">▦</span>Plan</button>
<button data-page="settings"><span class="ico">⚙</span>Więcej</button>
</nav><div id="toast" class="toast"></div>
<script>
const KEY='wolfEduDataV1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{school:'',classes:[],students:[],grades:[],attendance:[],lessons:[],tasks:[]};
let page='home',editingGradeId=null; const $=s=>document.querySelector(s); const app=$('#app');
function migrate(){db.grades=(db.grades||[]).map(g=>({...g,weight:Number(g.weight||1)}));db.subjects=db.subjects||[];db.tasks=(db.tasks||[]).map(t=>({...t,done:Boolean(t.done),type:t.type||'Zadanie domowe',priority:t.priority||'Normalny'}));save()}
function save(){db._sync=db._sync||{};db._sync.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(db));scheduleCloudSync()}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1700)}
function setHead(t,s){$('#headTitle').textContent=t;$('#headSub').textContent=s||db.school}
function setup(){setHead('WolfEdu','Pierwsza konfiguracja');$('#nav').classList.add('hidden');app.innerHTML=`<section class="setup"><div class="card"><h2>Utwórz swoją szkołę</h2><p class="muted">Dane zostają wyłącznie na tym telefonie.</p><input id="school" placeholder="Nazwa szkoły, np. SP 35 w Gdyni"><button style="width:100%;margin-top:8px" onclick="createSchool()">Uruchom WolfEdu</button></div></section>`}
function createSchool(){let v=$('#school').value.trim();if(!v)return toast('Wpisz nazwę szkoły');db.school=v;save();render('home')}
function render(p=page){page=p;if(!db.school&&!wolfSchool.schoolName)return setup();$('#nav').classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));({home,classes,grades,tasks,attendance,plan,settings}[page]||home)()}
function home(){
  let displaySchool=wolfSchool.schoolName||db.school||'WolfEdu';
  setHead(displaySchool,new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}));
  let cloud=!!wolfSchool.activeSchoolId;
  let gradesSrc=cloud?(wolfSchool.grades||[]):db.grades;
  let tasksSrc=cloud?(wolfSchool.tasks||[]):db.tasks;
  let attendanceSrc=cloud?(wolfSchool.attendance||[]):db.attendance;
  let studentsCount=cloud?(wolfSchool.students||[]).length:db.students.length;
  let totalWeight=gradesSrc.reduce((a,g)=>a+Number(g.weight||1),0);
  let avg=totalWeight?(gradesSrc.reduce((a,g)=>a+Number(g.value||0)*Number(g.weight||1),0)/totalWeight).toFixed(2):'—';
  let total=attendanceSrc.length,present=attendanceSrc.filter(a=>a.state==='Obecny').length;
  let att=total?Math.round(present/total*100):'—';
  let nextText='Brak lekcji na dziś.';
  if(cloud&&wolfSchool.timetable?.length){
    let day=new Date().getDay()||7,selected=localStorage.getItem('wolfEduPlanClass')||wolfSchool.classes?.[0]?.id||'',now=new Date().toTimeString().slice(0,5);
    let lessons=wolfSchool.timetable.filter(l=>l.classId===selected&&Number(l.day)===day).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));
    let n=lessons.find(l=>!l.end||l.end>=now)||lessons[0];
    if(n){let sub=wolfSchool.subjects.find(s=>s.id===n.subjectId);nextText=`Następna: <b>${esc(sub?.name||'Przedmiot')}</b>${n.start?' · '+esc(n.start):''}`}
  }
  let activeTasks=tasksSrc.filter(t=>!t.done).sort((a,b)=>String(a.due||'').localeCompare(String(b.due||''))).slice(0,3);
  app.innerHTML=`<div class="card hero"><span class="brand-pill">WolfEdu · Material 3</span><small>${cloud?'WolfCloud połączony':'Tryb lokalny'}</small><h2>${esc(displaySchool)}</h2><div>${nextText}</div></div>
  <div class="section-title"><h2>Najważniejsze</h2></div>
  <div class="quick">
    <button onclick="render('grades')"><span class="qico">★</span><b>Oceny</b><small>${cloud?'Realtime':'Lokalnie'}</small></button>
    <button onclick="render('plan')"><span class="qico">▦</span><b>Plan lekcji</b><small>${cloud?'Realtime':'Lokalnie'}</small></button>
    <button onclick="render('tasks')"><span class="qico">✓</span><b>Zadania</b><small>${cloud?'Realtime':'Lokalnie'}</small></button>
    <button onclick="render('attendance')"><span class="qico">◷</span><b>Frekwencja</b><small>${cloud?'Realtime':'Lokalnie'}</small></button>
    <button onclick="render('classes')"><span class="qico">♙</span><b>Klasy i uczniowie</b><small>${studentsCount} uczniów</small></button>
    <button onclick="render('settings')"><span class="qico">⚙</span><b>Ustawienia</b><small>Konto i synchronizacja</small></button>
  </div>
  <div class="section-title"><h2>Podsumowanie</h2></div>
  <div class="grid"><div class="stat"><small>Średnia ocen</small><b>${avg}</b></div><div class="stat"><small>Frekwencja</small><b>${att==='—'?'—':att+'%'}</b></div></div>
  <div class="card" style="margin-top:14px"><div class="row between"><div><h2 style="margin:0">Najbliższe terminy</h2><small>${activeTasks.length?'Do zrobienia':'Wszystko ogarnięte'}</small></div><button class="linkbtn" onclick="render('tasks')">Wszystkie</button></div>${activeTasks.map(t=>`<div class="item row between"><div><b>${esc(t.title||'Zadanie')}</b><br><small>${esc(t.due||'Bez terminu')}</small></div><span class="badge">${esc(t.type||'Zadanie')}</span></div>`).join('')||'<div class="empty">Brak aktywnych zadań</div>'}</div>`;
}
function classes(){
  let cloudMode=!!wolfSchool.activeSchoolId;
  setHead('Klasy i uczniowie',wolfSchool.schoolName||db.school);

  if(cloudMode){
    let cloudClasses=wolfSchool.classes||[], cloudStudents=wolfSchool.students||[];
    app.innerHTML=`<div class="card"><div class="row between"><div><h2 style="margin:0">Dane szkoły</h2><small>Synchronizacja realtime z panelem WWW</small></div><span class="badge">${esc(wolfSchool.role||'użytkownik')}</span></div><div class="warn" style="margin-top:10px">Edycja klas i uczniów jest teraz wykonywana w Panelu WWW, żeby Android i WWW nie tworzyły dwóch różnych wersji danych.</div></div>
    ${cloudClasses.map(c=>`<div class="card"><div class="row between"><div><h2 style="margin:0">Klasa ${esc(c.name)}</h2><small>${cloudStudents.filter(s=>s.classId===c.id).length} uczniów</small></div></div>
    ${cloudStudents.filter(s=>s.classId===c.id).map(s=>`<div class="item row between"><div class="row"><div class="avatar">${esc((s.name||'?').slice(0,1).toUpperCase())}</div><div><b>${esc(s.name||'Uczeń')}</b><br><small>${s.number?'nr '+esc(s.number):''}${s.email?' · '+esc(s.email):''}</small></div></div></div>`).join('')||'<div class="empty">Brak uczniów</div>'}</div>`).join('')||'<div class="card empty">Brak klas w tej szkole.</div>'}`;
    return;
  }

  app.innerHTML=`<div class="card warn"><b>Tryb lokalny / legacy</b><br>Po przypisaniu konta do szkoły dane klas będą pobierane z WolfCloud.</div><div class="card"><h2>Dodaj klasę</h2><div class="row"><input id="className" placeholder="np. 8B"><button onclick="addClass()">Dodaj</button></div></div>${db.classes.map(c=>`<div class="card"><div class="row between"><div><h2 style="margin:0">Klasa ${esc(c.name)}</h2><small>${db.students.filter(s=>s.classId===c.id).length} uczniów</small></div><button class="danger mini" onclick="removeClass('${c.id}')">Usuń</button></div><div class="row" style="margin-top:10px"><input id="student-${c.id}" placeholder="Imię i nazwisko ucznia"><button onclick="addStudent('${c.id}')">Dodaj</button></div>${db.students.filter(s=>s.classId===c.id).map(s=>`<div class="item row between"><div class="row"><div class="avatar">${esc(s.name.slice(0,1).toUpperCase())}</div><b>${esc(s.name)}</b></div><button class="danger mini" onclick="removeStudent('${s.id}')">×</button></div>`).join('')||'<div class="empty">Brak uczniów</div>'}</div>`).join('')||'<div class="card empty">Najpierw dodaj klasę.</div>'}`;
}
function addClass(){let v=$('#className').value.trim();if(!v)return;db.classes.push({id:id(),name:v});save();classes()}function removeClass(cid){if(!confirm('Usunąć klasę i jej dane?'))return;let ids=db.students.filter(s=>s.classId===cid).map(s=>s.id);db.classes=db.classes.filter(c=>c.id!==cid);db.students=db.students.filter(s=>s.classId!==cid);db.grades=db.grades.filter(g=>!ids.includes(g.studentId));db.attendance=db.attendance.filter(a=>!ids.includes(a.studentId));save();classes()}function addStudent(cid){let e=$('#student-'+cid),v=e.value.trim();if(!v)return;db.students.push({id:id(),classId:cid,name:v});save();classes()}function removeStudent(sid){db.students=db.students.filter(s=>s.id!==sid);db.grades=db.grades.filter(g=>g.studentId!==sid);db.attendance=db.attendance.filter(a=>a.studentId!==sid);save();classes()}
function studentOptions(){return db.students.map(s=>{let c=db.classes.find(x=>x.id===s.classId);return `<option value="${s.id}">${esc(s.name)} (${esc(c?.name||'?')})</option>`}).join('')}
function uniqueSubjects(){return [...new Set(db.grades.map(g=>g.subject.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'))}
function weightedAverage(list){let w=list.reduce((a,g)=>a+Number(g.weight||1),0);return w?list.reduce((a,g)=>a+Number(g.value)*Number(g.weight||1),0)/w:null}
function grades(){
  if(!wolfSchool.activeSchoolId){
    setHead('Oceny',db.school);
    app.innerHTML=`<div class="card warn"><b>Tryb legacy</b><br>Brak aktywnej szkoły WolfCloud.</div><div class="card"><h2>Oceny lokalne</h2>${db.grades.map(g=>`<div class="item"><b>${esc(g.subject||'Przedmiot')}</b> · ${esc(g.value)} (waga ${esc(g.weight||1)})</div>`).join('')||'<div class="empty">Brak ocen</div>'}</div>`;
    return;
  }
  setHead('Oceny',wolfSchool.schoolName);
  let students=wolfSchool.students||[],subjects=wolfSchool.subjects||[],teachers=wolfSchool.teachers||[],list=wolfSchool.grades||[];
  app.innerHTML=`<div class="card"><h2>Dodaj ocenę</h2>
  <select id="cgStudent"><option value="">Uczeń</option>${students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>
  <select id="cgSubject"><option value="">Przedmiot</option>${subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>
  <select id="cgTeacher"><option value="">Nauczyciel (opcjonalnie)</option>${teachers.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select>
  <div class="grid"><select id="cgValue">${[1,2,3,4,5,6].map(v=>`<option>${v}</option>`).join('')}</select><select id="cgWeight">${[1,2,3,4,5,6].map(v=>`<option value="${v}">Waga ${v}</option>`).join('')}</select></div>
  <input id="cgCategory" placeholder="Kategoria, np. sprawdzian"><input id="cgComment" placeholder="Komentarz">
  <input id="cgDate" type="date" value="${new Date().toISOString().slice(0,10)}">
  <button style="width:100%" onclick="addCloudGrade(this)">Dodaj ocenę</button></div>
  <div class="card"><h2>Oceny realtime</h2>${list.slice().reverse().map(g=>`<div class="item row between"><div><b>${esc(subjects.find(s=>s.id===g.subjectId)?.name||'Przedmiot')}</b><br><small>${esc(students.find(s=>s.id===g.studentId)?.name||'Uczeń')} · ${esc(g.category||'Ocena')}</small></div><div class="row"><span class="badge">${esc(g.value)} · waga ${esc(g.weight||1)}</span><button class="danger mini" onclick="WolfSync.deleteGrade('${g.id}')">×</button></div></div>`).join('')||'<div class="empty">Brak ocen</div>'}</div>`;
}
function addCloudGrade(btn){
  let student=$('#cgStudent').value,subject=$('#cgSubject').value;
  if(!student||!subject)return toast('Wybierz ucznia i przedmiot');
  btn.disabled=true;btn.textContent='Dodaję…';
  WolfSync.addGrade(student,subject,$('#cgTeacher').value,Number($('#cgValue').value),Number($('#cgWeight').value),$('#cgCategory').value.trim(),$('#cgComment').value.trim(),$('#cgDate').value);
}
