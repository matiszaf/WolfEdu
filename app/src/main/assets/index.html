<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#415f91">
  <title>WolfEdu</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div id="splash" class="splash">
    <div style="text-align:center">
      <div class="splash-logo">W</div>
      <h1>WolfEdu</h1>
      <p>Szkoła pod kontrolą</p>
    </div>
  </div>

  <header>
    <h1 id="headTitle">WolfEdu</h1>
    <p id="headSub">Twój inteligentny dziennik szkolny</p>
    <div id="syncPill" class="sync-pill">
      <span class="sync-dot"></span>
      <span id="syncPillText">Tylko lokalnie</span>
    </div>
  </header>

  <main id="app"></main>

  <nav id="nav" class="hidden">
    <button data-page="home"><span class="ico">⌂</span>Start</button>
    <button data-page="grades"><span class="ico">★</span>Oceny</button>
    <button data-page="tasks"><span class="ico">✓</span>Zadania</button>
    <button data-page="plan"><span class="ico">▦</span>Plan</button>
    <button data-page="settings"><span class="ico">⚙</span>Więcej</button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/school.js"></script>
  <script src="js/grades.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/timetable.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
