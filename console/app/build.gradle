plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'pl.wolfedu.console'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.wolfedu.console'
        minSdk 24
        targetSdk 35

        def consoleVersionName =
                System.getenv('WOLFEDU_CONSOLE_VERSION_NAME') ?:
                project.findProperty('WOLFEDU_CONSOLE_VERSION_NAME') ?:
                '0.1.0'

        def consoleVersionCode =
                (System.getenv('WOLFEDU_CONSOLE_VERSION_CODE') ?:
                project.findProperty('WOLFEDU_CONSOLE_VERSION_CODE') ?:
                '1000') as Integer

        versionCode consoleVersionCode
        versionName consoleVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_FILE')
            def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('KEY_ALIAS')
            def keyPasswordValue = System.getenv('KEY_PASSWORD')

            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
