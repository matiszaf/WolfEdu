<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#10131A">
  <title>WolfEdu Console</title>
  <link rel="stylesheet" href="css/console.css">
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="console-mark">W</div>
      <h1>WolfEdu Console</h1>
      <p>Panel operatorski platformy WolfEdu</p>
      <input id="email" type="email" placeholder="E-mail">
      <input id="password" type="password" placeholder="Hasło">
      <button id="loginBtn" onclick="login()">Zaloguj do Console</button>
      <div id="gateMsg" class="hint"></div>
    </div>
  </div>

  <div id="shell" class="shell hidden">
    <header>
      <div>
        <span class="eyebrow">WOLFEDU SYSTEM</span>
        <h1 id="pageTitle">Console</h1>
      </div>
      <button class="ghost" onclick="WolfConsole.logout()">Wyloguj</button>
    </header>

    <main id="app"></main>

    <nav>
      <button data-page="dashboard" class="active">⌂<span>System</span></button>
      <button data-page="schools">▦<span>Szkoły</span></button>
      <button data-page="admins">♚<span>Admini</span></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
